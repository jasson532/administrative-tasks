<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#0f0a1e"/>
  <rect width="1200" height="630" fill="url(#grad)" opacity="0.6"/>
  
  <!-- Logo -->
  <rect x="80" y="240" width="80" height="80" rx="16" fill="url(#logo-grad)"/>
  <text x="120" y="292" font-family="Inter, sans-serif" font-size="28" font-weight="700" fill="white" text-anchor="middle">ADL</text>
  
  <!-- Title -->
  <text x="190" y="272" font-family="Inter, sans-serif" font-size="52" font-weight="700" fill="white">Novedades ADL</text>
  <text x="190" y="320" font-family="Inter, sans-serif" font-size="22" fill="#a78bfa">Gestión de Ausencias y Equipos</text>
  
  <!-- Features -->
  <text x="80" y="420" font-family="Inter, sans-serif" font-size="18" fill="#94a3b8">Dashboard • PTO • Cumpleaños • Estadísticas • Disponibilidad</text>
  
  <!-- Bottom bar -->
  <rect y="590" width="1200" height="40" fill="#7c3aed"/>
  <text x="600" y="616" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="white" text-anchor="middle">Aval Digital Labs — Hackathon 2026</text>
  
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1200" y2="630">
      <stop offset="0%" stop-color="#4c1d95" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="logo-grad" x1="80" y1="240" x2="160" y2="320">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
